<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT21_INTERNAL_OPS</title>
    <style>
        :root { --neon-green: #00ff41; --bg-black: #0a0a0a; --terminal-gray: #1a1a1a; }
        body { background-color: var(--bg-black); color: var(--neon-green); font-family: 'Sora', 'Cascadia Mono', monospace; margin: 0; padding: 40px; }
        .header { border-bottom: 1px solid var(--neon-green); margin-bottom: 30px; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--terminal-gray); border: 1px solid #333; padding: 20px; border-radius: 4px; transition: 0.3s; }
        .card:hover { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
        .status { float: right; font-size: 0.7rem; padding: 2px 8px; border: 1px solid var(--neon-green); border-radius: 2px; }
        .on-process { background: var(--neon-green); color: black; }
        .label { color: #888; font-size: 0.7rem; margin-top: 10px; display: block; }
        .thai-text { font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .eng-text { font-size: 0.85rem; color: #ccc; font-style: italic; }
        #loader { font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>> BT21_CORE_MANIFEST.exe</h1>
        <div id="timestamp">SYSTEM_STATUS: ACTIVE</div>
    </div>

    <div id="loader">> ACCESSING ENCRYPTED DATA...</div>
    <div class="grid" id="taskGrid"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx6nRWv9aoykOacgBM5Cwhz34vR_ldsq1aHqRXX2rKta1-AFYECCJkrtyESWiMAFtavkQ/exec";

        async function init() {
            try {
                const response = await fetch(API_URL);
                const tasks = await response.json();
                document.getElementById('loader').style.display = 'none';
                render(tasks);
            } catch (err) {
                document.getElementById('loader').innerText = "> ERROR: CONNECTION_FAILED";
            }
        }

        function render(tasks) {
            const grid = document.getElementById('taskGrid');
            grid.innerHTML = tasks.map(t => `
                <div class="card">
                    <span class="status ${t.status === 'on process' ? 'on-process' : ''}">${t.status || 'WAITING'}</span>
                    <span class="label">// SECTION: ${t.section}</span>
                    <span class="thai-text">${t.thai}</span>
                    <span class="eng-text">> ${t.eng}</span>
                    <span class="label">// START_DATE: ${t.start}</span>
                </div>
            `).join('');
        }

        init();
        setInterval(init, 300000); // Auto-refresh every 5 minutes
    </script>
</body>
</html>
