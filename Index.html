<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #f4f7f6; padding: 20px; font-family: 'Inter', sans-serif; }
      .app-container { max-width: 800px; margin: auto; }
      .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
      .task-card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 12px; border-left: 6px solid #ffcc00; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; }
      .task-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
      .status-badge { font-size: 0.75rem; font-weight: bold; padding: 4px 12px; border-radius: 50px; text-transform: uppercase; }
      .on-process { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
      .pending { background: #e9ecef; color: #6c757d; }
      .btn-link-custom { font-size: 0.8rem; color: #007bff; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="header-section">
        <div>
          <h2 class="fw-bold mb-0">BT21 Project</h2>
          <span class="text-muted" style="font-size: 0.9rem;">Real-time Task Tracker</span>
        </div>
        <button class="btn btn-outline-primary btn-sm" onclick="copyLink()">Copy App URL</button>
      </div>

      <div id="taskList">
        <div class="text-center p-5 text-muted">Loading your tasks...</div>
      </div>
    </div>

    <script>
      const APP_LINK = "<?= appUrl ?>"; // This is where the script injects your link

      function copyLink() {
        navigator.clipboard.writeText(APP_LINK);
        alert("App URL copied to clipboard!");
      }

      function loadTasks() {
        google.script.run.withSuccessHandler(showTasks).getSheetData();
      }

      function showTasks(data) {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        if (data.length === 0) {
          list.innerHTML = '<div class="text-center text-muted">No active tasks found in "working" sheet.</div>';
          return;
        }
        data.forEach(row => {
          if(!row[3]) return; 
          const isProcessing = row[2] === 'on process';
          const html = `
            <div class="task-card">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="mb-1 fw-bold text-dark">${row[3]}</h6>
                  <div class="text-muted small">${row[4] || 'Translation pending...'}</div>
                </div>
                <span class="status-badge ${isProcessing ? 'on-process' : 'pending'}">
                  ${row[2] || 'WAITING'}
                </span>
              </div>
              <hr class="my-2 opacity-25">
              <div class="d-flex justify-content-between text-muted" style="font-size: 0.75rem;">
                <span><strong>Section:</strong> ${row[1]}</span>
                <span><strong>Start:</strong> ${row[5] ? new Date(row[5]).toLocaleDateString() : 'TBD'}</span>
              </div>
            </div>
          `;
          list.insertAdjacentHTML('beforeend', html);
        });
      }

      window.onload = loadTasks;
    </script>
  </body>
</html>
