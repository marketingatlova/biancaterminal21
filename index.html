<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIANCA | MANIFEST</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #E4DBD8; 
            --card: #FFFFFF; 
            --text: #2E1515; 
            --accent: #B98A5B; 
            --lavender: #E5D4ED;
            --secondary: #8E7F7F;
            --done-text: #A09595;
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 40px 20px; 
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 900px; margin: auto; }

        /* Header */
        .header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end; }
        h1 { font-family: 'Sora', sans-serif; font-size: 1.5rem; font-weight: 600; margin: 0; text-transform: uppercase; }
        .sub-header { color: var(--secondary); font-size: 11px; font-weight: 600; letter-spacing: 1px; }

        /* Vertical Stack Layout */
        .stack { display: flex; flex-direction: column; gap: 12px; }
        
        .list-item { 
            background: var(--card); border-radius: 12px; padding: 20px 25px; 
            display: flex; align-items: center; justify-content: space-between;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(46, 21, 21, 0.03);
            border: 1px solid rgba(0,0,0,0.03);
        }

        /* Greyout State */
        .list-item.is-done { 
            background: rgba(255,255,255,0.4); 
            opacity: 0.6; 
            filter: grayscale(1); 
            box-shadow: none;
            order: 999; /* Forces to bottom */
        }

        .item-info { flex-grow: 1; margin-right: 20px; }
        .tag { font-size: 9px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; }
        
        /* Typography */
        .input-edit { 
            background: transparent; border: none; color: var(--text); 
            width: 100%; padding: 2px 0; font-family: inherit; 
            font-size: 1rem; font-weight: 500;
        }
        .input-edit:focus { outline: none; border-bottom: 1px solid var(--accent); }
        
        .eng-subtle { 
            color: var(--secondary); 
            font-size: 0.75rem; 
            font-style: italic; 
            margin-top: 2px; 
            display: block;
            opacity: 0.7;
        }

        /* Action Buttons */
        .btn-check {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; background: transparent; color: transparent; flex-shrink: 0;
        }
        .btn-check:hover { background: rgba(185, 138, 91, 0.1); }
        .is-done .btn-check { background: var(--accent); color: white; border-color: var(--accent); }

        #loader { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: #FFF; padding: 8px 20px; border-radius: 100px; 
            font-size: 10px; font-weight: 600; display: none; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="loader">SYNCHRONIZING...</div>
    
    <div class="container">
        <div class="header">
            <div>
                <h1>Bianca <span style="font-weight: 300;">Manifest</span></h1>
                <div class="sub-header">T21 OPS // PRODUCTION_QUEUE</div>
            </div>
            <div id="count" style="font-size: 10px; color: var(--secondary); font-weight: 600;">LOADING...</div>
        </div>

        <div class="stack" id="listStack">
            </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx6nRWv9aoykOacgBM5Cwhz34vR_ldsq1aHqRXX2rKta1-AFYECCJkrtyESWiMAFtavkQ/exec";

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                render(data);
            } catch (e) { console.error(e); }
        }

        async function triggerAction(rowId, action, extra = {}, isDoneSheet = false) {
            if(isDoneSheet) return; // Prevent clicking already done items
            document.getElementById('loader').style.display = 'block';
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify({ rowId, action, ...extra })
                });
                setTimeout(fetchData, 1000);
            } catch (e) { console.error(e); }
            finally { setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 800); }
        }

        function render(data) {
            const stack = document.getElementById('listStack');
            const total = data.working.length + data.done.length;
            document.getElementById('count').innerText = `${data.working.length} ACTIVE // ${data.done.length} COMPLETED`;
            
            // Combine both, marking the "done" items
            const allItems = [
                ...data.working.map(t => ({...t, isDone: false})),
                ...data.done.map(t => ({...t, isDone: true}))
            ];

            stack.innerHTML = allItems.map(t => `
                <div class="list-item ${t.isDone ? 'is-done' : ''}">
                    <div class="item-info">
                        <span class="tag">${t.section} ${t.isDone ? '// ARCHIVED' : ''}</span>
                        <input class="input-edit" value="${t.thai}" 
                               ${t.isDone ? 'disabled' : ''}
                               onblur="if(this.dataset.orig !== this.value) triggerAction(${t.rowId}, 'edit', {thai: this.value})">
                        <span class="eng-subtle">${t.eng || '...'}</span>
                    </div>
                    <button class="btn-check" onclick="triggerAction(${t.rowId}, 'complete', {}, ${t.isDone})">✓</button>
                </div>
            `).join('');
        }

        fetchData();
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
