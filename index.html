<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIANCA | TERMINAL 21 OPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --cream: #F8E6A9; 
            --teal: #24947B; 
            --dark: #2A2203; 
            --amber: #EEC229;
            --card-bg: #352d0a; /* Slightly lighter than background for depth */
        }
        body { background: var(--dark); color: var(--cream); font-family: 'Sora', sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1300px; margin: auto; }
        
        /* Header & Filter Bar */
        .header { border-bottom: 1px solid rgba(248, 230, 169, 0.2); padding: 20px 0; margin-bottom: 30px; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        
        /* Filter Buttons */
        .filter-btn { 
            background: transparent; border: 1px solid var(--cream); color: var(--cream); 
            padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 11px; 
            letter-spacing: 1px; transition: 0.3s; 
        }
        .filter-btn.active, .filter-btn:hover { background: var(--teal); border-color: var(--teal); color: white; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid rgba(248, 230, 169, 0.1); padding: 25px; border-radius: 8px; transition: 0.3s ease; }
        .card:hover { border-color: var(--amber); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .tag { font-size: 10px; color: var(--amber); letter-spacing: 2px; margin-bottom: 15px; display: block; font-weight: 600; }
        .status-pill { font-size: 9px; padding: 3px 10px; border-radius: 2px; background: rgba(238, 194, 41, 0.1); color: var(--amber); border: 1px solid var(--amber); margin-bottom: 15px; display: inline-block; }
        
        /* Edit Inputs */
        .input-edit { background: transparent; border: none; border-bottom: 1px solid rgba(248, 230, 169, 0.2); color: var(--cream); width: 100%; padding: 8px 0; margin-bottom: 15px; font-family: inherit; }
        .input-edit:focus { outline: none; border-color: var(--teal); }
        
        /* Actions */
        .btn-complete { 
            background: var(--teal); border: none; color: white; padding: 12px; width: 100%; 
            border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-top: 10px;
        }
        .btn-complete:hover { background: #1d7a65; }

        #loader { position: fixed; top: 20px; right: 20px; background: var(--amber); color: var(--dark); padding: 5px 15px; border-radius: 4px; font-size: 10px; font-weight: bold; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <div id="loader">SYNCING_TO_SHEET...</div>
    
    <div class="container">
        <div class="header">
            <h1 style="margin:0; font-size:1.5rem; letter-spacing: -1px;">BIANCA <span style="font-weight:200;">COMMAND CENTER</span></h1>
            <p style="color:var(--amber); font-size:10px; margin:5px 0 0 0;">OPERATIONS v4.5 // PROJECT_BT21</p>
        </div>

        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" onclick="filterTasks('ALL', this)">ALL</button>
            <button class="filter-btn" onclick="filterTasks('FIN', this)">FIN</button>
            <button class="filter-btn" onclick="filterTasks('HRD', this)">HRD</button>
            <button class="filter-btn" onclick="filterTasks('MKT', this)">MKT</button>
            <button class="filter-btn" onclick="filterTasks('OPT', this)">OPT</button>
        </div>

        <div class="grid" id="grid">
            <div style="color:var(--amber);">INITIALIZING_MANIFEST...</div>
        </div>
    </div>

    <script>
        // REPLACE THIS URL WITH YOUR DEPLOYED GOOGLE SCRIPT URL
        const API_URL = "https://script.google.com/macros/s/AKfycbx6nRWv9aoykOacgBM5Cwhz34vR_ldsq1aHqRXX2rKta1-AFYECCJkrtyESWiMAFtavkQ/exec";
        let allTasks = [];

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                allTasks = await res.json();
                render(allTasks);
            } catch (e) { console.error(e); }
        }

        function filterTasks(section, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (section === 'ALL') {
                render(allTasks);
            } else {
                const filtered = allTasks.filter(t => t.section === section);
                render(filtered);
            }
        }

        async function triggerAction(rowId, action, extra = {}) {
            document.getElementById('loader').style.display = 'block';
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify({ rowId, action, ...extra })
                });
                setTimeout(fetchData, 1500); // Allow time for Sheets to process
            } catch (e) { console.error(e); }
            finally { setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1000); }
        }

        function render(tasks) {
            const grid = document.getElementById('grid');
            grid.innerHTML = tasks.map(t => `
                <div class="card">
                    <span class="tag">// ${t.section}</span>
                    <div class="status-pill">${t.status ? t.status.toUpperCase() : 'PENDING'}</div>
                    
                    <input class="input-edit" style="font-weight:600; font-size: 1.1rem;" value="${t.thai}" 
                           onblur="if(this.dataset.orig !== this.value) triggerAction(${t.rowId}, 'edit', {thai: this.value})"
                           data-orig="${t.thai}">
                    
                    <input class="input-edit" style="color:var(--amber); font-style:italic; font-size:0.85rem;" value="${t.eng}"
                           onblur="if(this.dataset.orig !== this.value) triggerAction(${t.rowId}, 'edit', {eng: this.value})"
                           data-orig="${t.eng}">
                    
                    <div style="font-size:10px; opacity:0.6; margin-bottom:20px;">START: ${t.start}</div>
                    
                    <button class="btn-complete" onclick="triggerAction(${t.rowId}, 'complete')">Mark Complete</button>
                </div>
            `).join('');
        }

        fetchData();
        setInterval(fetchData, 300000); // Sync every 5 mins
    </script>
</body>
</html>
