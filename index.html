<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIANCA | MANIFEST</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #E4DBD8; 
            --card: #FFFFFF; 
            --text: #2E1515; 
            --accent: #B98A5B; 
            --lavender: #E5D4ED;
            --secondary: #8E7F7F;
            --border: rgba(46, 21, 21, 0.08);
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 40px 20px; 
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 800px; margin: auto; }

        /* Header & Filters */
        .header { margin-bottom: 30px; }
        h1 { font-family: 'Sora', sans-serif; font-size: 1.4rem; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: -0.5px; }
        
        .filter-bar { display: flex; gap: 8px; margin-bottom: 40px; overflow-x: auto; padding: 5px 0; }
        .filter-btn { 
            background: transparent; border: 1px solid var(--border); color: var(--secondary); 
            padding: 8px 20px; border-radius: 100px; cursor: pointer; font-size: 10px; 
            font-weight: 600; letter-spacing: 1px; transition: 0.3s;
        }
        .filter-btn.active { background: var(--text); color: #FFF; border-color: var(--text); }

        /* Vertical List */
        .stack { display: flex; flex-direction: column; gap: 8px; }
        
        .list-item { 
            background: var(--card); border-radius: 16px; padding: 18px 24px; 
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }

        /* Completed State */
        .list-item.is-done { 
            background: rgba(255,255,255,0.4); 
            opacity: 0.5; 
            order: 99; /* Push to bottom */
            box-shadow: none;
        }

        .item-content { flex-grow: 1; margin-right: 15px; }
        .tag { font-size: 8.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; display: block; }
        
        /* Inputs */
        .input-edit { 
            background: transparent; border: none; color: var(--text); 
            width: 100%; padding: 0; font-family: inherit; 
            font-size: 0.95rem; font-weight: 500;
        }
        .input-edit:focus { outline: none; }
        
        .eng-subtle { 
            color: var(--secondary); font-size: 0.7rem; font-style: italic; 
            margin-top: 2px; display: block; opacity: 0.8; 
        }

        /* Professional Tick Box */
        .tick-wrapper { position: relative; width: 30px; height: 30px; flex-shrink: 0; }
        .tick-box {
            width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--accent);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; background: transparent; font-size: 14px; color: transparent;
        }
        .tick-box:hover { background: rgba(185, 138, 91, 0.1); }
        .is-done .tick-box { background: var(--accent); color: white; border-color: var(--accent); }

        #sync-toast { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: #FFF; padding: 10px 24px; border-radius: 100px; 
            font-size: 10px; font-weight: 600; display: none; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="sync-toast">UPDATING MASTER SHEET...</div>
    
    <div class="container">
        <div class="header">
            <h1>Bianca <span style="font-weight: 300;">Ops</span></h1>
            <div style="font-size: 10px; color: var(--secondary); font-weight: 600; margin-top: 5px;">PRODUCTION MANIFEST // BT21</div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('ALL', this)">ALL</button>
            <button class="filter-btn" onclick="setFilter('FIN', this)">FIN</button>
            <button class="filter-btn" onclick="setFilter('HRD', this)">HRD</button>
            <button class="filter-btn" onclick="setFilter('MKT', this)">MKT</button>
            <button class="filter-btn" onclick="setFilter('OPT', this)">OPT</button>
        </div>

        <div class="stack" id="mainStack"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx6nRWv9aoykOacgBM5Cwhz34vR_ldsq1aHqRXX2rKta1-AFYECCJkrtyESWiMAFtavkQ/exec";
        let localData = { working: [], done: [] };
        let currentFilter = 'ALL';

        async function fetchData() {
            const res = await fetch(API_URL);
            localData = await res.json();
            render();
        }

        function setFilter(section, btn) {
            currentFilter = section;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        async function triggerAction(rowId, action, extra = {}) {
            document.getElementById('sync-toast').style.display = 'block';
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors', 
                body: JSON.stringify({ rowId, action, ...extra })
            });
            setTimeout(() => { 
                document.getElementById('sync-toast').style.display = 'none'; 
                fetchData(); 
            }, 1200);
        }

        function render() {
            const stack = document.getElementById('mainStack');
            const filterItems = (list) => currentFilter === 'ALL' ? list : list.filter(i => i.section === currentFilter);
            
            const active = filterItems(localData.working).map(t => ({...t, isDone: false}));
            const completed = filterItems(localData.done).map(t => ({...t, isDone: true}));

            stack.innerHTML = [...active, ...completed].map(t => `
                <div class="list-item ${t.isDone ? 'is-done' : ''}">
                    <div class="item-content">
                        <span class="tag">${t.section}</span>
                        <input class="input-edit" value="${t.thai}" 
                               ${t.isDone ? 'disabled' : ''}
                               onblur="if(this.dataset.orig !== this.value) triggerAction(${t.rowId}, 'edit', {thai: this.value})"
                               data-orig="${t.thai}">
                        <span class="eng-subtle">${t.eng || ''}</span>
                    </div>
                    <div class="tick-wrapper">
                        <div class="tick-box" onclick="if(!${t.isDone}) triggerAction(${t.rowId}, 'complete')">✓</div>
                    </div>
                </div>
            `).join('');
        }

        fetchData();
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
